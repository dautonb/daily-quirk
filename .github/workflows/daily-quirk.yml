name: Daily Quirk Agent

on:
  schedule:
    # 07:00, 13:00, 20:00 giờ Việt Nam (UTC+7) = 00:00, 06:00, 13:00 UTC
    - cron: "0 0,6,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-quirk
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run agent
        env:
          ORTHOGONAL_API_KEY:  ${{ secrets.ORTHOGONAL_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          # Tuỳ chọn — chỉ cần nếu endpoint/model khác default
          ORTHOGONAL_BASE:     ${{ vars.ORTHOGONAL_BASE }}
          ORTHOGONAL_MODEL:    ${{ vars.ORTHOGONAL_MODEL }}
        run: python scripts/agent.py

      - name: Commit topic history
        run: |
          git config user.name  "quirk-bot"
          git config user.email "quirk-bot@users.noreply.github.com"
          git add data/history.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: log topic $(date -u +%F_%H%M)"
            git pull --rebase --autostash || true
            git push
          fi
